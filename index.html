<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="col-md-7 mx-auto">
      <h2 class="mb-4 text-center">Task Manager</h2>
      <div class="input-group mb-3">
        <input id="taskInput" class="form-control" placeholder="Naya task likho">
        <button id="addBtn" class="btn btn-primary">Add</button>
      </div>
      <div class="btn-group mb-3 w-100" id="filters">
        <button class="btn btn-outline-secondary active" data-filter="all">Sab</button>
        <button class="btn btn-outline-secondary" data-filter="pending">Pending</button>
        <button class="btn btn-outline-secondary" data-filter="done">Done</button>
      </div>
      <ul id="taskList" class="list-group mb-3"></ul>
      <div class="d-flex justify-content-between text-secondary">
        <span id="count"></span>
        <button id="clearDone" class="btn btn-sm btn-outline-danger">Done wale hatao</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
